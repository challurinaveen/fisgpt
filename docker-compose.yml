services:
  fis-gpt:
    build: .
    container_name: fis-gpt
    ports:
      - "8501:8501"
    env_file:
      - .env
    volumes:
      # Mount the pre-built database + embeddings (read-only)
      - ./out:/app/out:ro
      # Writable volume for audit log and preferences (survives restarts)
      - fis-data:/app/data
    environment:
      - FIS_DATA_DIR=/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:
  fis-data:
