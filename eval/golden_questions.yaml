# ---------------------------------------------------------------------------
# MEASURE QUERIES (20) — answered by SQL, hand-verifiable
# ---------------------------------------------------------------------------

  - id: M01
    route: measure
    question: "How many product tests do we have in the FoodFax database in total?"
    ground_truth: "SELECT count(*) FROM curated.product_test_v;"
    expects_value: 25914
    notes: "13,278 historic + 6,770 norm + 5,807 pre-2021 + 59 session PDFs = 25,914 total."

  - id: M02
    route: measure
    question: "What years does the FoodFax data cover?"
    ground_truth: "SELECT min(test_year), max(test_year) FROM curated.product_test_v;"
    expects_value: [2002, 2025]

  - id: M03
    route: measure
    question: "How many distinct categories have we ever tested in?"
    ground_truth: "SELECT count(DISTINCT category_name) FROM curated.product_test_v;"
    expects_value: 464

  - id: M04
    route: measure
    question: "How many manufacturers are in the database?"
    ground_truth: "SELECT count(DISTINCT manufacturer_name) FROM curated.product_test_v;"
    expects_value: 2367

  - id: M05
    route: measure
    question: "Which categories have we tested most often?"
    ground_truth: |
      SELECT category_name, count(*) n FROM curated.product_test_v
      GROUP BY 1 ORDER BY n DESC LIMIT 10;
    expects: ["World Cooking Sauces"]
    notes: "World Cooking Sauces leads the historic table at 267."

  - id: M06
    route: measure
    question: "Which categories have we tested least in the last five years?"
    ground_truth: |
      SELECT category_name, count(*) n FROM curated.product_test_v
      WHERE test_year >= 2020 GROUP BY 1 ORDER BY n ASC LIMIT 20;
    notes: "The commercial question behind this is where the norms are getting thin."

  - id: M07
    route: measure
    question: "How does Taste score for own-label versus branded products?"
    ground_truth: |
      SELECT own_label_or_brand, round(avg(value),3) FROM curated.measure_value_v
      WHERE measure_name = 'Taste' AND variant = 'MEAN' GROUP BY 1;
    notes: "Must report base sizes and must not mix attribute scales."

  - id: M08
    route: measure
    question: "Has Value for Money improved or declined since 2016?"
    ground_truth: |
      SELECT test_year, round(avg(value),3), count(*) FROM curated.measure_value_v
      WHERE measure_name = 'Value for Money' AND variant = 'MEAN'
        AND test_year >= 2016 GROUP BY 1 ORDER BY 1;
    expects_chart: true

  - id: M09
    route: measure
    question: "What is the average Taste mean score across the whole database?"
    ground_truth: |
      SELECT round(avg(value),4) FROM curated.measure_value_v
      WHERE measure_name = 'Taste' AND variant = 'MEAN';
    expects: ["3.82"]
    notes: "Avg across all sources is 3.8204. Accept 3.82 or 3.8204 — model may round."

  - id: M10
    route: measure
    question: "Everything we have ever tested for Quorn."
    ground_truth: |
      SELECT product_name, test_year, category_name FROM curated.product_test_v
      WHERE manufacturer_name ILIKE '%Quorn%' ORDER BY test_year DESC;

  - id: M11
    route: measure
    question: "Which products in 2025 beat their category average?"
    ground_truth: |
      SELECT product_name, score_out_of_50, category_average, vs_category_norm
      FROM curated.session_report_v WHERE vs_category_norm > 0
      ORDER BY vs_category_norm DESC;
    expects_value: 14
    notes: "14 of the 59 parsed 2025 session reports beat their category norm."

  - id: M12
    route: measure
    question: "What was the worst-performing product in Set 26 and by how much did it miss the norm?"
    ground_truth: |
      SELECT product_name, score_out_of_50, category_average, vs_category_norm
      FROM curated.session_report_v WHERE session_set = 'Set 26'
      ORDER BY vs_category_norm ASC LIMIT 1;
    expects: ["Mac 'N' Cheese Head"]
    expects_value: -19

  - id: M13
    route: measure
    question: "Which manufacturers appear most often in the last five years?"
    ground_truth: |
      SELECT manufacturer_name, count(*) n FROM curated.product_test_v
      WHERE test_year >= 2020 GROUP BY 1 ORDER BY n DESC LIMIT 15;

  - id: M14
    route: measure
    question: "How many products have we tested per year since 2016?"
    ground_truth: |
      SELECT test_year, count(*) FROM curated.product_test_v
      WHERE test_year >= 2016 GROUP BY 1 ORDER BY 1;
    expects_chart: true
    notes: "Ground truth from Current Norm Summary: 2016=1667 2017=1473 2018=1693 2019=828 2020=145 2021=192 2022=282 2023=232 2024=258."

  - id: M15
    route: measure
    question: "What is the split between Premium and Standard/Value products?"
    ground_truth: |
      SELECT tier, count(*) FROM curated.product_test_v GROUP BY 1;
    notes: "Current Norm Summary totals: 2,672 Premium, 4,098 Standard & Value."

  - id: M16
    route: measure
    question: "Which retailers do we have the most own-label products from?"
    ground_truth: |
      SELECT manufacturer_name, count(*) n FROM curated.product_test_v
      WHERE own_label_or_brand = 'Own Label' GROUP BY 1 ORDER BY n DESC LIMIT 15;

  - id: M17
    route: measure
    question: "Which demographic over-indexes on noticing the Bio & Me Good Gut Puffs?"
    ground_truth: |
      SELECT banner_group, banner_level, pct, base_n FROM curated.crosstab_v
      WHERE cmr_ref = '240556' AND question_text ILIKE 'Notice%'
        AND response_option = 'Top 2 box' ORDER BY pct DESC;
    notes: "Must flag base sizes — several banner cells are n < 15."

  - id: M18
    route: measure
    question: "How many products were tested in each session set in 2025?"
    ground_truth: |
      SELECT session_set, count(*) FROM curated.session_report_v
      GROUP BY 1 ORDER BY 1;
    notes: "Sets 26-32. Set 32 has 1 report because the rest failed to download."

  - id: M19
    route: measure
    question: "What is the average price of products we tested in 2025, by storage type?"
    ground_truth: |
      SELECT storage, round(avg(price_gbp),2), count(*) FROM curated.product_test_v
      WHERE test_year = 2025 GROUP BY 1;

  - id: M20
    route: measure
    question: "Which project types are in the database and how many tests does each have?"
    ground_truth: |
      SELECT project_type, count(*) n FROM curated.product_test_v
      GROUP BY 1 ORDER BY n DESC;
    expects: ["FFX", "GOLA", "NPA", "BEA", "GAS", "OMNI"]
    notes: "Historic Products: FFX 6419, GOLA 5891, NPA 702, BEA 259, GAS 6, OMNI 1."

