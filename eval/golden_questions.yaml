# ===========================================================================
# F!S Internal GPT · golden question set  (draft v0.1 — for kickoff sign-off)
#
# 60 questions across four routes. Every question here is answerable (or
# correctly refusable) against data that is ACTUALLY PRESENT in the corpus as
# of the Phase 1 audit — nothing references Future Food or Appetite Shift,
# which have not been delivered.
#
# Written by: Phase 1 profiling run, seeded from real values in the data.
# Needs: one reviewer each from insight, innovation and client-facing (Q6 of
#        the kickoff list) to correct the wording and add what is missing.
#
# route:      document | measure | hybrid | refuse
# expects:    substrings/values a correct answer must contain
# ground_truth: SQL against curated.* that produces the verifiable figure
# must_cite:  the answer must cite at least one of these sources
# ===========================================================================

meta:
  version: "0.1-draft"
  created: "2026-08-20"
  corpus_snapshot: "FoodFax only — Sets 26-32 (2025) + archive to 2024"
  status: "AWAITING F!S SIGN-OFF"
  ship_gates:
    numeric_exactness_pct: 95
    citation_precision_pct: 90
    fabricated_sources: 0
    retrieval_recall_at_10_pct: 85
    correct_refusal_pct: 95

